name: Build Signed Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK with Secret Key
        env:
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -v -p 4 "$APK" aligned.apk

          # Membuat keystore menggunakan password dari GitHub Secret
          keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
            -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=FARAI Official, O=FARAI"

          # Tanda tangani APK (password otomatis disensor menjadi *** di log)
          "$BT/apksigner" sign --ks release.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out FARAI-2.0.2.apk aligned.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: "FARAI Release v2.0.2"
          body: "Official release build of FARAI 2.0.2"
          files: FARAI-2.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FARAI-2.0.2-Release-APK
          path: FARAI-2.0.2.apk
