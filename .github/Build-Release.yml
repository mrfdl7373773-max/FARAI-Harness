name: Build Signed Release APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleRelease --no-daemon
      - name: Sign APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BT/zipalign" -v -p 4 "$APK" aligned.apk
          keytool -genkeypair -v -keystore release.jks -storetype PKCS12 -alias farai -keyalg RSA -keysize 2048 -validity 10000 -storepass farai2026 -keypass farai2026 -dname "CN=Farrel, O=FARAI"
          "$BT/apksigner" sign --ks release.jks --ks-key-alias farai --ks-pass pass:farai2026 --key-pass pass:farai2026 --out FARAI-2.0.2.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FARAI-2.0.2-Release-APK
          path: FARAI-2.0.2.apk
